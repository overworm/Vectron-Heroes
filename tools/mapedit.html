<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Lost Hero map editor</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#161a22;--panel:#1e2430;--line:#2e3646;--fg:#d8deea;--dim:#8b95a8;--acc:#ffcc33;--bad:#ff6b6b;--ok:#6be08a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.35 system-ui,Segoe UI,Arial,sans-serif}
#app{display:grid;grid-template-columns:230px 1fr 290px;grid-template-rows:42px 1fr 24px;height:100%}
#top{grid-column:1/4;display:flex;gap:6px;align-items:center;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line)}
#left,#right{background:var(--panel);overflow:auto;padding:8px}
#left{border-right:1px solid var(--line)}#right{border-left:1px solid var(--line)}
#cv{width:100%;height:100%;display:block;background:#0d1016;cursor:crosshair}
#wrap{position:relative;overflow:hidden}
#status{grid-column:1/4;background:var(--panel);border-top:1px solid var(--line);padding:3px 8px;color:var(--dim);white-space:nowrap;overflow:hidden}
button,select,input{background:#2a3242;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:3px 7px;font:inherit}
button{cursor:pointer}button:hover{background:#364056}button.on{background:#4a5a82;border-color:var(--acc)}
h4{margin:10px 0 4px;color:var(--acc);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.tools button{width:48%;margin:1px 0}
.pal{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:3px;cursor:pointer}
.pal:hover{background:#2a3242}.pal.on{background:#4a5a82}
.sw{width:12px;height:12px;border-radius:2px;flex:none;border:1px solid #0006}
.warn{color:var(--bad)}.okk{color:var(--ok)}.plan{color:#e0a040;font-size:11px}
.f{display:grid;grid-template-columns:62px 1fr;gap:3px 6px;align-items:center;margin:2px 0}
.f input,.f select{width:100%}
#msgs div{margin:2px 0}
.small{font-size:11px;color:var(--dim)}
</style></head><body>
<div id="app">
 <div id="top">
  <b>Lost Hero maps</b>
  <select id="mapsel"></select><button id="bnew">New</button>
  <button id="bsave">Save (Ctrl+S)</button><button id="bcomp">Save + Compile .map</button>
  <button id="bundo">Undo</button><button id="bredo">Redo</button>
  <button id="bfit">Fit</button>
  <span class="small" id="dirty"></span>
 </div>
 <div id="left">
  <h4>Tools</h4>
  <div class="tools" id="tools"></div>
  <h4>Objects</h4>
  <div id="pal"></div>
  <div class="small">⚠ = type is saved into the map, but the engine skips it for now</div>
 </div>
 <div id="wrap"><canvas id="cv"></canvas></div>
 <div id="right">
  <h4>Map</h4>
  <div class="f"><label>name</label><input id="m_name"></div>
  <div class="f"><label>map_id</label><input id="m_id" type="number"></div>
  <div class="f"><label>boss_id</label><input id="m_boss" type="number"></div>
  <div class="f"><label>size</label><span id="m_size" class="small"></span></div>
  <h4>Selected</h4><div id="props" class="small">nothing selected</div>
  <h4>Checkpoints (in quest-chain order)</h4><div id="cps"></div>
  <h4>Check</h4><div id="msgs"></div>
 </div>
 <div id="status">ready</div>
</div>
<script>
"use strict";
const FLOORS=[176,304,432,560], TILE=16;
const $=s=>document.querySelector(s);
let CAT=[],CATK={},ROOMT=[],M=null,NAME='',dirty=false;
let tool='select',brush=null,sel=null,Z=0.8,OX=20,OY=10,undo=[],redo=[],drag=null,mouse={x:0,y:0};
const cv=$('#cv'),g=cv.getContext('2d');

const TOOLS=[['select','Select / move'],['tile','Tile paint'],['erase','Tile erase'],['tilerect','Tile rect'],['eraserect','Erase rect'],
 ['cp','Checkpoint'],['spawn','Enemy spawn'],['hero','Hero start'],['room','Room type'],['arena','Boss arena'],['pan','Pan']];
const ROOMCOL={auto:'#0000',open:'#3a8a4a55',closable:'#c0a03055',dead_end:'#80404055',special:'#3060c066',boss:'#c0308066'};

async function api(path,opt){const r=await fetch(path,opt);const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){j={error:t}}if(!r.ok)throw new Error(j.error||r.status);return j}
function status(s){$('#status').textContent=s}
function snap(){return JSON.stringify(M)}
function commit(){undo.push(snap());if(undo.length>80)undo.shift();redo=[];setDirty(true);draw();panel()}
function setDirty(d){dirty=d;$('#dirty').textContent=d?'● unsaved':''}
function doUndo(){if(!undo.length)return;redo.push(snap());M=JSON.parse(undo.pop());sel=null;setDirty(true);draw();panel()}
function doRedo(){if(!redo.length)return;undo.push(snap());M=JSON.parse(redo.pop());sel=null;setDirty(true);draw();panel()}

function catOf(o){if(o.cat&&CATK[o.cat])return CATK[o.cat];let k=o.kind||0;return CAT.find(c=>c.type===o.type&&c.kind===k)||CAT.find(c=>c.type===o.type)||null}
function W(){return M.size.width*TILE}function H(){return M.size.height*TILE}
function s2w(x,y){return[(x-OX)/Z,(y-OY)/Z]}
function snapv(v,s){return Math.round(v/s)*s}
function uniq(base){let n=1,names=new Set(M.objects.map(o=>o.name));base=base.toLowerCase();while(names.has(base+n))n++;return base+n}

/* ---------- rooms layout (как level_room в движке) ---------- */
function roomLayout(){
 if(M.meta.map_id===3){const cols=[0,26*16,51*16,76*16,1e9],rows=[0,328,456,1e9];
  return {cols:4,rows:3,idx:(c,r)=>c*3+r,cx:cols,ry:rows};}
 return {cols:3,rows:4,idx:(c,r)=>c*4+r,cx:[0,33*16,66*16,1e9],ry:[0,200,328,456,1e9]};
}

/* ---------- drawing ---------- */
function resize(){const r=$('#wrap').getBoundingClientRect();cv.width=r.width;cv.height=r.height;draw()}
function draw(){
 if(!M)return;
 g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);
 g.setTransform(Z,0,0,Z,OX,OY);
 g.fillStyle='#10141c';g.fillRect(0,0,W(),H());
 // rooms tint
 const L=roomLayout(),rooms=M.rooms||[];
 for(let c=0;c<L.cols;c++)for(let r=0;r<L.rows;r++){
  const x0=L.cx[c],x1=Math.min(L.cx[c+1],W()),y0=L.ry[r],y1=Math.min(L.ry[r+1],H());
  const t=rooms[L.idx(c,r)]||'auto';g.fillStyle=ROOMCOL[t]||'#0000';g.fillRect(x0,y0,x1-x0,y1-y0);
  g.strokeStyle='#2a3a52';g.lineWidth=1/Z;g.strokeRect(x0,y0,x1-x0,y1-y0);
  g.fillStyle='#7a8aa8';g.font=(11/Z)+'px sans-serif';g.fillText('room '+L.idx(c,r)+' · '+t,x0+4/Z,y0+12/Z);
 }
 // grid
 g.strokeStyle='#ffffff0d';g.lineWidth=1/Z;g.beginPath();
 for(let x=0;x<=W();x+=TILE*2){g.moveTo(x,0);g.lineTo(x,H())}
 for(let y=0;y<=H();y+=TILE*2){g.moveTo(0,y);g.lineTo(W(),y)}g.stroke();
 // floors
 g.strokeStyle='#ffcc3355';g.setLineDash([6/Z,4/Z]);
 FLOORS.forEach((f,i)=>{g.beginPath();g.moveTo(0,f);g.lineTo(W(),f);g.stroke();g.fillStyle='#ffcc33aa';g.font=(10/Z)+'px sans-serif';g.fillText('floor '+(i+1)+'  y='+f,W()-110/Z,f-3/Z)});
 g.setLineDash([]);
 // tiles
 g.fillStyle='#46506a';
 for(let ty=0;ty<M.size.height;ty++){const row=M.tiles[ty];for(let tx=0;tx<M.size.width;tx++)if(row[tx])g.fillRect(tx*TILE,ty*TILE,TILE,TILE)}
 // arena
 const A=M.arena;if(A&&A.x1>A.x0){g.strokeStyle='#ff44aa';g.setLineDash([8/Z,5/Z]);g.strokeRect(A.x0,A.ceil,A.x1-A.x0,A.floor-A.ceil);
  g.strokeStyle='#ff44aa66';g.strokeRect(A.trig_x0,A.ceil,A.trig_x1-A.trig_x0,A.floor-A.ceil);g.setLineDash([]);g.fillStyle='#ff44aa';g.fillText('boss arena',A.x0+4/Z,A.ceil+12/Z)}
 // links
 g.lineWidth=1/Z;
 M.objects.forEach((o,i)=>{if(o.target===undefined||o.target==='')return;const t=M.objects.find(q=>q.name===o.target);if(!t)return;
  g.strokeStyle='#ffffff55';g.setLineDash([3/Z,3/Z]);g.beginPath();g.moveTo(o.x+o.w/2,o.y+o.h/2);g.lineTo(t.x+t.w/2,t.y+t.h/2);g.stroke();g.setLineDash([])});
 // objects
 M.objects.forEach((o,i)=>{
  const c=catOf(o),col=c?c.color:'#ff00ff';
  if(o.type==='O_LIFT'&&o.y0!==undefined){g.fillStyle=col+'22';const top=Math.min(o.y0,o.y1),h=Math.abs(o.y0-o.y1);g.fillRect(o.x,top,o.w,h+8)}
  if(o.type==='O_PLAT'&&o.kind===1&&o.x1!==undefined){g.fillStyle=col+'22';g.fillRect(o.x,o.y,Math.abs(o.x1-o.x)+o.w,o.h)}
  g.fillStyle=col+(o.visible===false?'66':'cc');g.fillRect(o.x,o.y,o.w,o.h);
  g.strokeStyle=(sel&&sel.t==='o'&&sel.i===i)?'#fff':'#000a';g.lineWidth=(sel&&sel.t==='o'&&sel.i===i?2:1)/Z;g.strokeRect(o.x,o.y,o.w,o.h);
  if(o.quest){g.fillStyle='#fff';g.beginPath();g.arc(o.x+o.w/2,o.y-6/Z,5/Z,0,7);g.fill();g.fillStyle='#000';g.font=(8/Z)+'px sans-serif';g.fillText('Q',o.x+o.w/2-2.5/Z,o.y-3.5/Z)}
  g.fillStyle='#fff';g.font=(10/Z)+'px sans-serif';g.fillText(o.name||'',o.x+2/Z,o.y+Math.min(o.h,12/Z)+(o.h<12/Z?-o.h-2/Z:0));
  if(c&&!c.engine){g.fillStyle='#ffb040';g.fillText('⚠',o.x+o.w-10/Z,o.y+10/Z)}
 });
 // spawns / heroes / checkpoints
 (M.spawns||[]).forEach((s,i)=>{g.fillStyle='#ff5050';g.beginPath();g.arc(s.x,s.y-4,4/Z*1.2,0,7);g.fill();if(sel&&sel.t==='s'&&sel.i===i){g.strokeStyle='#fff';g.stroke()}});
 (M.heroes||[]).forEach((s,i)=>{g.fillStyle='#50a0ff';g.fillRect(s.x-4,s.y-12,8,12);g.fillStyle='#fff';g.font=(9/Z)+'px sans-serif';g.fillText('H'+(i+1),s.x-6,s.y-14/Z*1)});
 (M.checkpoints||[]).forEach((c,i)=>{g.fillStyle='#ffe000';g.beginPath();g.moveTo(c.x,c.y-26);g.lineTo(c.x-12,c.y);g.lineTo(c.x+12,c.y);g.closePath();g.fill();
  g.strokeStyle=(sel&&sel.t==='c'&&sel.i===i)?'#fff':'#000';g.lineWidth=(sel&&sel.t==='c'&&sel.i===i?2:1)/Z;g.stroke();
  g.fillStyle='#000';g.font='bold '+(11/Z)+'px sans-serif';g.fillText(String(i+1)+'S',c.x-8,c.y-4)});
 // ghost
 if(tool==='place'&&brush){const c=CATK[brush];g.fillStyle=c.color+'66';const [wx,wy]=s2w(mouse.x,mouse.y);g.fillRect(snapv(wx,8),snapv(wy,8),c.w,c.h)}
 if(drag&&drag.mode==='rect'){g.strokeStyle=tool==='eraserect'?'#f66':'#6f6';g.lineWidth=1/Z;g.strokeRect(drag.x0,drag.y0,drag.x1-drag.x0,drag.y1-drag.y0)}
}

/* ---------- hit tests ---------- */
function hit(wx,wy){
 const cps=M.checkpoints||[];
 for(let i=cps.length-1;i>=0;i--){const c=cps[i];if(Math.abs(wx-c.x)<=14&&wy<=c.y+2&&wy>=c.y-28)return{t:'c',i}}
 const sp=M.spawns||[];for(let i=0;i<sp.length;i++)if(Math.hypot(wx-sp[i].x,wy-(sp[i].y-4))<8)return{t:'s',i};
 const hs=M.heroes||[];for(let i=0;i<hs.length;i++)if(Math.abs(wx-hs[i].x)<6&&wy<=hs[i].y&&wy>=hs[i].y-12)return{t:'h',i};
 for(let i=M.objects.length-1;i>=0;i--){const o=M.objects[i];if(wx>=o.x-2&&wx<=o.x+o.w+2&&wy>=o.y-2&&wy<=o.y+o.h+2)return{t:'o',i}}
 return null;
}
function nearestFloor(y){let b=y,d=40;for(const f of FLOORS)if(Math.abs(f-y)<d){d=Math.abs(f-y);b=f}return b}

/* ---------- mouse ---------- */
function paintTile(wx,wy,v){const tx=Math.floor(wx/TILE),ty=Math.floor(wy/TILE);if(tx<0||ty<0||tx>=M.size.width||ty>=M.size.height)return;if(M.tiles[ty][tx]!==v){M.tiles[ty][tx]=v;draw()}}
cv.addEventListener('contextmenu',e=>{e.preventDefault();const [wx,wy]=s2w(e.offsetX,e.offsetY),h=hit(wx,wy);if(h){sel=h;delSel()}});
cv.addEventListener('mousedown',e=>{
 if(!M)return;mouse={x:e.offsetX,y:e.offsetY};const [wx,wy]=s2w(e.offsetX,e.offsetY);
 if(e.button===1||tool==='pan'||e.getModifierState(' ')){drag={mode:'pan',sx:e.clientX,sy:e.clientY,ox:OX,oy:OY};return}
 if(e.button!==0)return;
 if(tool==='tile'||tool==='erase'){drag={mode:'tile',v:tool==='tile'?1:0,dirty:true};paintTile(wx,wy,drag.v);return}
 if(tool==='tilerect'||tool==='eraserect'){drag={mode:'rect',x0:snapv(wx,TILE),y0:snapv(wy,TILE),x1:snapv(wx,TILE),y1:snapv(wy,TILE)};return}
 if(tool==='place'&&brush){const c=CATK[brush];const x=snapv(wx,8),y=snapv(wy,8);const o={name:uniq(c.key),cat:c.key,type:c.type,kind:c.kind,x,y,w:c.w,h:c.h};
  if(c.type==='O_LIFT'){o.y0=y;o.y1=y-128;o.need=c.key==='LIFT'?1:1}
  if(c.type==='O_PLAT'&&c.kind===1)o.x1=x+64;
  if(c.type==='O_BRIDGE'){o.need=1;o.visible=false}
  if(c.type==='O_ROPE')o.dir=1;
  M.objects.push(o);sel={t:'o',i:M.objects.length-1};commit();return}
 if(tool==='cp'){const h=hit(wx,wy);if(h&&h.t==='c'){sel=h;drag={mode:'move',t:'c'};draw();panel();return}
  if((M.checkpoints||[]).length>=8){status('max 8 checkpoints');return}
  M.checkpoints=M.checkpoints||[];M.checkpoints.push({x:snapv(wx,2),y:nearestFloor(snapv(wy,2))});sel={t:'c',i:M.checkpoints.length-1};commit();return}
 if(tool==='spawn'){M.spawns=M.spawns||[];M.spawns.push({x:snapv(wx,4),y:nearestFloor(snapv(wy,2))});commit();return}
 if(tool==='hero'){const h=hit(wx,wy);if(h&&h.t==='h'){sel=h;drag={mode:'move',t:'h'};draw();return}return}
 if(tool==='room'){const L=roomLayout();let c=0,r=0;while(c<L.cols-1&&wx>=L.cx[c+1])c++;while(r<L.rows-1&&wy>=L.ry[r+1])r++;
  M.rooms=M.rooms||[];while(M.rooms.length<12)M.rooms.push('auto');const k=L.idx(c,r),t=M.rooms[k]||'auto';M.rooms[k]=ROOMT[(ROOMT.indexOf(t)+1)%ROOMT.length];commit();status('room '+k+': '+M.rooms[k]);return}
 if(tool==='arena'){drag={mode:'rect',arena:true,x0:snapv(wx,TILE),y0:snapv(wy,TILE),x1:snapv(wx,TILE),y1:snapv(wy,TILE)};return}
 // select
 const h=hit(wx,wy);sel=h;
 if(h){const o=h.t==='o'?M.objects[h.i]:null;
  const corner=o&&Math.abs(wx-(o.x+o.w))<6/Z&&Math.abs(wy-(o.y+o.h))<6/Z;
  drag={mode:corner?'resize':'move',t:h.t,i:h.i,dx:o?wx-o.x:0,dy:o?wy-o.y:0,moved:false}}
 draw();panel();
});
cv.addEventListener('mousemove',e=>{
 mouse={x:e.offsetX,y:e.offsetY};const [wx,wy]=s2w(e.offsetX,e.offsetY);
 status(`x=${Math.round(wx)} y=${Math.round(wy)}  tile ${Math.floor(wx/TILE)},${Math.floor(wy/TILE)}  zoom ${Z.toFixed(2)}`);
 if(drag){
  if(drag.mode==='pan'){OX=drag.ox+(e.clientX-drag.sx);OY=drag.oy+(e.clientY-drag.sy)}
  else if(drag.mode==='tile')paintTile(wx,wy,drag.v);
  else if(drag.mode==='rect'){drag.x1=snapv(wx,TILE);drag.y1=snapv(wy,TILE)}
  else if(drag.mode==='resize'){const o=M.objects[drag.i];o.w=Math.max(4,snapv(wx-o.x,2));o.h=Math.max(4,snapv(wy-o.y,2));drag.moved=true}
  else if(drag.mode==='move'){
   drag.moved=true;
   if(drag.t==='o'){const o=M.objects[drag.i];const nx=snapv(wx-drag.dx,e.shiftKey?1:8),ny=snapv(wy-drag.dy,e.shiftKey?1:8);const ddx=nx-o.x,ddy=ny-o.y;o.x=nx;o.y=ny;
    if(o.x1!==undefined&&o.type==='O_PLAT')o.x1+=ddx;if(o.y0!==undefined&&o.type==='O_LIFT'){o.y0+=ddy;o.y1+=ddy}}
   else if(drag.t==='c'){const c=M.checkpoints[sel.i];c.x=snapv(wx,2);c.y=e.shiftKey?snapv(wy,2):nearestFloor(snapv(wy,2))}
   else if(drag.t==='s'){const c=M.spawns[sel.i];c.x=snapv(wx,4);c.y=nearestFloor(snapv(wy,2))}
   else if(drag.t==='h'){const c=M.heroes[sel.i];c.x=snapv(wx,2);c.y=nearestFloor(snapv(wy,2))}
  }
 }
 draw();
});
window.addEventListener('mouseup',()=>{
 if(!drag)return;const d=drag;drag=null;
 if(d.mode==='tile'){commit();return}
 if(d.mode==='rect'){const x0=Math.min(d.x0,d.x1),x1=Math.max(d.x0,d.x1),y0=Math.min(d.y0,d.y1),y1=Math.max(d.y0,d.y1);
  if(d.arena){M.arena=M.arena||{};Object.assign(M.arena,{x0,x1,ceil:y0,floor:y1,trig_x0:Math.max(0,x0-18),trig_x1:x1+14});commit();return}
  const v=tool==='tilerect'?1:0;for(let ty=y0/TILE;ty<y1/TILE;ty++)for(let tx=x0/TILE;tx<x1/TILE;tx++)if(ty>=0&&tx>=0&&ty<M.size.height&&tx<M.size.width)M.tiles[ty][tx]=v;commit();return}
 if(d.mode==='move'||d.mode==='resize'){if(d.moved)commit();else{draw();panel()}}
 if(d.mode==='pan')draw();
});
cv.addEventListener('wheel',e=>{e.preventDefault();const [wx,wy]=s2w(e.offsetX,e.offsetY);Z=Math.min(4,Math.max(0.2,Z*(e.deltaY<0?1.15:1/1.15)));OX=e.offsetX-wx*Z;OY=e.offsetY-wy*Z;draw()},{passive:false});
window.addEventListener('keydown',e=>{
 if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;
 if(e.ctrlKey&&e.key==='s'){e.preventDefault();save(false)}
 else if(e.ctrlKey&&e.key==='z'){e.preventDefault();doUndo()}
 else if(e.ctrlKey&&(e.key==='y'||e.key==='Y')){e.preventDefault();doRedo()}
 else if(e.key==='Delete'||e.key==='Backspace')delSel();
 else if(e.key==='d'&&sel&&sel.t==='o'){const o=JSON.parse(JSON.stringify(M.objects[sel.i]));o.name=uniq((o.cat||'obj'));o.x+=16;o.y+=16;M.objects.push(o);sel={t:'o',i:M.objects.length-1};commit()}
 else if(e.key.startsWith('Arrow')&&sel){e.preventDefault();const s=e.shiftKey?1:8,dx=e.key==='ArrowLeft'?-s:e.key==='ArrowRight'?s:0,dy=e.key==='ArrowUp'?-s:e.key==='ArrowDown'?s:0;
  const t=sel.t==='o'?M.objects[sel.i]:sel.t==='c'?M.checkpoints[sel.i]:sel.t==='s'?M.spawns[sel.i]:M.heroes[sel.i];t.x+=dx;t.y+=dy;commit()}
});
function delSel(){if(!sel)return;
 if(sel.t==='o'){const n=M.objects[sel.i].name;M.objects.splice(sel.i,1);M.objects.forEach(o=>{if(o.target===n)delete o.target})}
 else if(sel.t==='c')M.checkpoints.splice(sel.i,1);else if(sel.t==='s')M.spawns.splice(sel.i,1);else if(sel.t==='h'){status('hero starts cannot be deleted (7 required)');return}
 sel=null;commit()}

/* ---------- panels ---------- */
function buildTools(){
 $('#tools').innerHTML=TOOLS.map(([k,l])=>`<button data-t="${k}" class="${tool===k?'on':''}">${l}</button>`).join('');
 $('#tools').querySelectorAll('button').forEach(b=>b.onclick=()=>{tool=b.dataset.t;brush=null;buildTools();buildPal();cv.style.cursor=tool==='pan'?'grab':'crosshair'});
}
function buildPal(){
 let h='',grp='';
 CAT.forEach(c=>{if(c.group!==grp){grp=c.group;h+=`<h4>${grp}</h4>`}
  h+=`<div class="pal ${tool==='place'&&brush===c.key?'on':''}" data-k="${c.key}" title="${c.hint}"><span class="sw" style="background:${c.color}"></span><span>${c.label}${c.engine?'':' <span class="plan">⚠</span>'}</span></div>`});
 $('#pal').innerHTML=h;$('#pal').querySelectorAll('.pal').forEach(d=>d.onclick=()=>{tool='place';brush=d.dataset.k;buildTools();buildPal()});
}
const F=(l,id,v,t='text')=>`<div class="f"><label>${l}</label><input id="${id}" type="${t}" value="${v===undefined?'':v}"></div>`;
function panel(){
 if(!M)return;
 $('#m_name').value=M.meta.name;$('#m_id').value=M.meta.map_id;$('#m_boss').value=M.meta.boss_id;$('#m_size').textContent=`${M.size.width}×${M.size.height} tiles (${W()}×${H()} px)`;
 const P=$('#props');
 if(!sel){P.innerHTML='nothing selected'}
 else if(sel.t==='o'){const o=M.objects[sel.i];const c=catOf(o);
  const names=['<option value=""></option>'].concat(M.objects.filter(q=>q!==o).map(q=>`<option ${q.name===o.target?'selected':''}>${q.name}</option>`)).join('');
  P.innerHTML=`<div>${c?c.label:o.type}${c&&!c.engine?' <span class="plan">⚠ planned</span>':''}</div>`+F('name','p_name',o.name)+
   `<div class="f"><label>type</label><select id="p_cat">${CAT.map(k=>`<option value="${k.key}" ${c&&c.key===k.key?'selected':''}>${k.label}</option>`).join('')}</select></div>`+
   F('x','p_x',o.x,'number')+F('y','p_y',o.y,'number')+F('w','p_w',o.w,'number')+F('h','p_h',o.h,'number')+F('kind','p_kind',o.kind||0,'number')+
   (o.type==='O_LIFT'?F('y0 (low)','p_y0',o.y0,'number')+F('y1 (high)','p_y1',o.y1,'number'):'')+
   (o.type==='O_PLAT'&&(o.kind===1)?F('x1','p_x1',o.x1,'number'):'')+
   F('need','p_need',o.need||0,'number')+F('dir','p_dir',o.dir||0,'number')+
   `<div class="f"><label>target</label><select id="p_target">${names}</select></div>`+
   `<div class="f"><label>flags</label><span><label><input type="checkbox" id="p_quest" ${o.quest?'checked':''}> quest</label> <label><input type="checkbox" id="p_vis" ${o.visible===false?'':'checked'}> visible</label> <label><input type="checkbox" id="p_ho" ${o.hero_only?'checked':''}> hero-only</label></span></div>`;
  const bind=(id,fn)=>{const el=$('#'+id);el.onchange=()=>{fn(el);commit()}};
  bind('p_name',el=>{const old=o.name;const nv=el.value.trim();if(nv&&!M.objects.some(q=>q!==o&&q.name===nv)){M.objects.forEach(q=>{if(q.target===old)q.target=nv});o.name=nv}});
  bind('p_cat',el=>{const k=CATK[el.value];o.cat=k.key;o.type=k.type;o.kind=k.kind});
  ['x','y','w','h','kind','y0','y1','x1','need','dir'].forEach(f=>{const el=$('#p_'+f);if(el)el.onchange=()=>{o[f]=parseInt(el.value||0);commit()}});
  bind('p_target',el=>{if(el.value)o.target=el.value;else delete o.target});
  bind('p_quest',el=>{if(el.checked)o.quest=true;else delete o.quest});
  bind('p_vis',el=>{if(el.checked)delete o.visible;else o.visible=false});
  bind('p_ho',el=>{if(el.checked)o.hero_only=true;else delete o.hero_only});
 } else if(sel.t==='c'){P.innerHTML=`Checkpoint ${sel.i+1}S`+F('x','c_x',M.checkpoints[sel.i].x,'number')+F('y','c_y',M.checkpoints[sel.i].y,'number');
  ['x','y'].forEach(f=>$('#c_'+f).onchange=e=>{M.checkpoints[sel.i][f]=parseInt(e.target.value||0);commit()})}
 else if(sel.t==='s')P.innerHTML='Enemy spawn point (Del to remove)';
 else P.innerHTML='Hero start H'+(sel.i+1);
 // checkpoints list
 $('#cps').innerHTML=(M.checkpoints||[]).map((c,i)=>`<div><b style="color:#ffe000">${i+1}S</b> x=${c.x} y=${c.y} <button data-u="${i}">↑</button><button data-d="${i}">↓</button></div>`).join('')||'<span class="small">none: Checkpoint tool → click on the map</span>';
 $('#cps').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const i=+b.dataset.u;if(i>0){const a=M.checkpoints;[a[i-1],a[i]]=[a[i],a[i-1]];commit()}});
 $('#cps').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const i=+b.dataset.d,a=M.checkpoints;if(i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];commit()}});
 check();
}
function solidAt(x,y){const tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);return ty>=0&&tx>=0&&ty<M.size.height&&tx<M.size.width&&M.tiles[ty][tx]}
function check(){
 const m=[],names={};
 const q=M.objects.filter(o=>o.quest).length;
 m.push(`<div>Quests: <b>${q}</b> — boss room opens at ${q}/${q}</div>`);
 M.objects.forEach(o=>{if(names[o.name])m.push(`<div class="warn">duplicate name: ${o.name}</div>`);names[o.name]=1;
  if(o.target&&!M.objects.some(t=>t.name===o.target))m.push(`<div class="warn">${o.name}: target "${o.target}" missing</div>`);
  const c=catOf(o);if(c&&!c.engine)m.push(`<div class="plan">⚠ ${o.name}: ${c.label} — engine skips it for now</div>`);
  if(o.type==='O_LIFT'&&(o.y0===undefined||o.y1===undefined||o.y1>=o.y0))m.push(`<div class="warn">${o.name}: lift needs y1 &lt; y0</div>`)});
 (M.checkpoints||[]).forEach((c,i)=>{if(!solidAt(c.x,c.y+1)&&!M.objects.some(o=>(o.type==='O_BRIDGE'||o.type==='O_PLAT'||o.type==='O_LIFT')&&c.x>=o.x&&c.x<=o.x+o.w&&Math.abs(o.y-c.y)<=2))m.push(`<div class="warn">${i+1}S is not standing on a floor/platform (OK only if on a bridge that is on at that point)</div>`)});
 if(!(M.checkpoints||[]).length)m.push('<div class="warn">no checkpoints</div>');
 if(M.objects.length>128)m.push(`<div class="warn">${M.objects.length} objects &gt; 128 (pc profile)</div>`);
 if(!(M.arena&&M.arena.x1>M.arena.x0))m.push('<div class="plan">boss arena not set</div>');
 $('#msgs').innerHTML=m.join('')||'<span class="okk">ok</span>';
}

/* ---------- io ---------- */
async function loadList(sel_){const j=await api('/api/maps');const s=$('#mapsel');s.innerHTML=j.maps.map(n=>`<option ${n===sel_?'selected':''}>${n}</option>`).join('');return j.maps}
async function openMap(n){
 if(dirty&&!confirm('Discard unsaved changes?'))return;
 M=await api('/api/map?name='+n);NAME=n;M.rooms=M.rooms||Array(12).fill('auto');M.checkpoints=M.checkpoints||[];M.spawns=M.spawns||[];M.objects=M.objects||[];
 undo=[];redo=[];sel=null;setDirty(false);fit();panel();status('opened '+n);
}
async function save(compile){
 if(!M)return;
 try{await api('/api/map?name='+NAME,{method:'POST',body:JSON.stringify(M)});setDirty(false);
  if(compile){const r=await api('/api/compile?name='+NAME,{method:'POST'});status('saved + compiled: '+r.files.join(', ')+' ('+r.bytes+' bytes)')}else status('saved '+NAME+'.json')}
 catch(e){status('ERROR: '+e.message);alert(e.message)}
}
function fit(){const r=cv.getBoundingClientRect();Z=Math.min(r.width/(W()+40),r.height/(H()+40));OX=20;OY=20;draw()}
$('#mapsel').onchange=e=>openMap(e.target.value);
$('#bsave').onclick=()=>save(false);$('#bcomp').onclick=()=>save(true);$('#bundo').onclick=doUndo;$('#bredo').onclick=doRedo;$('#bfit').onclick=fit;
$('#bnew').onclick=async()=>{const n=prompt('New map file name (e.g. level4):','level4');if(!n)return;try{await api('/api/new?name='+n,{method:'POST'});await loadList(n);await openMap(n)}catch(e){alert(e.message)}};
$('#m_name').onchange=e=>{M.meta.name=e.target.value;commit()};$('#m_id').onchange=e=>{M.meta.map_id=parseInt(e.target.value||1);commit()};$('#m_boss').onchange=e=>{M.meta.boss_id=parseInt(e.target.value||0);commit()};
window.addEventListener('resize',resize);window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
(async()=>{
 const c=await api('/api/catalog');CAT=c.catalog;ROOMT=c.room_types;CAT.forEach(k=>CATK[k.key]=k);
 buildTools();buildPal();resize();
 const list=await loadList();if(list.length){await openMap(list[0])}else status('no maps: press New');
})();
</script></body></html>
